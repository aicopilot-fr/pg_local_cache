name: Apply PR9 benchmark capacity fix

on:
  push:
    branches:
      - agent/export-pr9-source
    paths:
      - .github/workflows/export-pr9-source.yml

permissions:
  contents: write

concurrency:
  group: apply-pr9-benchmark-capacity-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/ordinary-select-in
          fetch-depth: 0

      - name: Apply and validate non-workflow changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          path = root / 'benchmarks/whole_row.py'
          source = path.read_text()
          old = '''    capacity = int(compare.psql(config, "SHOW pg_local_cache.cache_entries"))
              if config.keys > capacity:
                  raise ValueError(
                      f"whole-row keyspace {config.keys} exceeds cache capacity {capacity}"
                  )
              return capacity
          '''
          new = '''    capacity = int(compare.psql(config, "SHOW pg_local_cache.cache_entries"))
              required_capacity = config.keys * 2
              if required_capacity > capacity:
                  raise ValueError(
                      "whole-row comparison needs room for both attached benchmark "
                      f"keyspaces ({required_capacity} entries), but cache capacity is "
                      f"{capacity}"
                  )
              return capacity
          '''
          if old not in source:
              raise SystemExit('whole_row capacity block not found')
          path.write_text(source.replace(old, new, 1))

          path = root / 'tests/whole_row_benchmark_test.py'
          source = path.read_text()
          anchor = '''    def test_kvik_keys_reverse_json_fields_but_keep_composite_values(self) -> None:
          '''
          addition = '''    def test_mapped_setup_requires_capacity_for_both_keyspaces(self) -> None:
                  cfg = config(keys=8)
                  with mock.patch.object(whole_row, "setup_role"), mock.patch.object(
                      compare, "psql", side_effect=["", "15"]
                  ):
                      with self.assertRaisesRegex(
                          ValueError, "room for both attached benchmark keyspaces"
                      ):
                          whole_row.setup_mapped_postgres(cfg, 64)

                  with mock.patch.object(whole_row, "setup_role"), mock.patch.object(
                      compare, "psql", side_effect=["", "16"]
                  ):
                      self.assertEqual(whole_row.setup_mapped_postgres(cfg, 64), 16)

          '''
          if anchor not in source:
              raise SystemExit('whole-row test anchor not found')
          path.write_text(source.replace(anchor, addition + anchor, 1))

          path = root / 'docs/BENCHMARKS.md'
          source = path.read_text()
          source = source.replace(
              '| Keys / cache entries | 128 / 128 |',
              '| Keys per attached table / cache entries | 128 / 256 |',
              1,
          )
          source = source.replace(
              'PGLC_BENCH_CACHE_ENTRIES=128 \\\n',
              'PGLC_BENCH_CACHE_ENTRIES=256 \\\n',
              1,
          )
          if '| Keys per attached table / cache entries | 128 / 256 |' not in source:
              raise SystemExit('benchmark capacity row was not updated')
          path.write_text(source)
          PY

          python3 -m py_compile \
            benchmarks/whole_row.py \
            tests/whole_row_benchmark_test.py
          python3 -m unittest -v tests/whole_row_benchmark_test.py
          make source-test source-sanitize benchmark-test
          git diff --check

      - name: Publish fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add benchmarks/whole_row.py tests/whole_row_benchmark_test.py docs/BENCHMARKS.md
          git diff --cached --check
          git commit -m 'fix: size comparison cache for both keyspaces'
          git push origin HEAD:feat/ordinary-select-in

name: Release PostgreSQL 16 artifacts

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg_local_cache-release
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: postgres:16.14-bookworm

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable_tag: ${{ steps.meta.outputs.stable_tag }}
      commit_tag: ${{ steps.meta.outputs.commit_tag }}
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      stable_publishable: ${{ steps.meta.outputs.stable_publishable }}
      workflow_run_id: ${{ steps.meta.outputs.workflow_run_id }}
    env:
      TARGET_SHA: >-
        ${{ github.event_name == 'workflow_run'
            && github.event.workflow_run.head_sha
            || github.sha }}
      TRIGGER_RUN_ID: >-
        ${{ github.event_name == 'workflow_run'
            && github.event.workflow_run.id
            || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact successful commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata and immutable tag policy
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail

          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$TARGET_SHA" ]]

          main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha
          )"
          [[ "$sha" == "$main_sha" ]] || {
            echo "::error::Release candidate is no longer the tip of main"
            exit 1
          }

          mapfile -t versions < <(
            sed -n \
              "s/^default_version = '\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'$/\1/p" \
              pg_local_cache.control
          )
          [[ "${#versions[@]}" == 1 ]] || {
            echo "::error::control file needs one strict X.Y.Z default_version"
            exit 1
          }

          version="${versions[0]}"
          stable_tag="v${version}"
          short_sha="${sha:0:12}"
          commit_tag="main-${short_sha}"

          test -f "sql/pg_local_cache--${version}.sql"
          grep -Fq "pg_local_cache--${version}.sql" Dockerfile
          grep -Fq "pg_local_cache_version:${version}" \
            src/pg_local_cache_worker.c

          stable_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${stable_tag}" \
              --jq .sha 2>/dev/null || true
          )"
          stable_publishable=true
          if [[ -n "$stable_sha" && "$stable_sha" != "$sha" ]]; then
            stable_publishable=false
            echo "::notice::${stable_tag} already belongs to ${stable_sha}; this commit will publish only ${commit_tag}"
          fi

          workflow_run_id="$TRIGGER_RUN_ID"
          if [[ -z "$workflow_run_id" ]]; then
            workflow_run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${sha}\")][0].id // empty"
            )"
          fi
          [[ -n "$workflow_run_id" ]] || {
            echo "::error::No successful main CI run exists for ${sha}"
            exit 1
          }

          {
            echo "version=${version}"
            echo "stable_tag=${stable_tag}"
            echo "commit_tag=${commit_tag}"
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "stable_publishable=${stable_publishable}"
            echo "workflow_run_id=${workflow_run_id}"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
      TRIGGER_RUN_ID: ${{ needs.metadata.outputs.workflow_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate packaging inputs
        run: |
          set -Eeuo pipefail
          test -x scripts/install-existing.sh
          test -f docs/INSTALL_EXISTING.md
          test -f docs/BENCHMARKS.md
          test -f docs/TECHNICAL.md
          bash -n scripts/install-existing.sh
          make source-test source-sanitize benchmark-test

      - name: Build PostgreSQL 16 Debian 12 amd64 binary
        shell: bash
        run: |
          set -Eeuo pipefail
          image="pg_local_cache-release:${RELEASE_SHA}"
          docker build \
            --platform linux/amd64 \
            --target extension \
            --build-arg "POSTGRES_IMAGE=${POSTGRES_IMAGE}" \
            --tag "$image" \
            .

          reported_version="$(
            docker run --rm --entrypoint postgres "$image" --version
          )"
          [[ "$reported_version" == *" 16."* ]]
          docker run --rm --entrypoint /bin/sh "$image" -ec \
            'ldd /usr/lib/postgresql/16/lib/pg_local_cache.so'

      - name: Assemble deterministic source and binary archives
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist release-stage

          source_name="pg_local_cache-${VERSION}-source"
          git archive \
            --format=tar \
            --prefix="${source_name}/" \
            "$RELEASE_SHA" |
            gzip -n -9 > "dist/${source_name}.tar.gz"

          binary_name="pg_local_cache-${VERSION}-pg16-bookworm-amd64"
          root="release-stage/${binary_name}"
          install -d \
            "$root/usr/lib/postgresql/16/lib" \
            "$root/usr/share/postgresql/16/extension" \
            "$root/docs" \
            "$root/benchmarks" \
            "$root/monitoring"

          image="pg_local_cache-release:${RELEASE_SHA}"
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker cp \
            "${container}:/usr/lib/postgresql/16/lib/pg_local_cache.so" \
            "$root/usr/lib/postgresql/16/lib/"
          docker cp \
            "${container}:/usr/share/postgresql/16/extension/pg_local_cache.control" \
            "$root/usr/share/postgresql/16/extension/"
          docker cp \
            "${container}:/usr/share/postgresql/16/extension/pg_local_cache--${VERSION}.sql" \
            "$root/usr/share/postgresql/16/extension/"

          install -m 0755 scripts/install-existing.sh "$root/install.sh"
          install -m 0644 README.md LICENSE "$root/"
          install -m 0644 \
            docs/INSTALL_EXISTING.md \
            docs/BENCHMARKS.md \
            docs/TECHNICAL.md \
            "$root/docs/"
          install -m 0644 benchmarks/SCENARIOS.md "$root/benchmarks/"
          install -m 0644 monitoring/README.md "$root/monitoring/"

          {
            printf 'version=%s\n' "$VERSION"
            printf 'commit=%s\n' "$RELEASE_SHA"
            printf 'postgres_major=16\n'
            printf 'platform=linux/amd64\n'
            printf 'distribution=debian12-bookworm\n'
            printf 'build_image=%s\n' "$POSTGRES_IMAGE"
          } > "$root/RELEASE-METADATA"

          epoch="$(git show -s --format=%ct "$RELEASE_SHA")"
          find release-stage -exec touch -h -d "@${epoch}" {} +
          tar \
            --sort=name \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime="@${epoch}" \
            -C release-stage \
            -cf - \
            "$binary_name" |
            gzip -n -9 > "dist/${binary_name}.tar.gz"

      - name: Preserve benchmark evidence from the successful CI run
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-evidence/comparison ci-evidence/sql-only

          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name comparison-smoke \
            --dir ci-evidence/comparison
          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sql-only-benchmark-smoke \
            --dir ci-evidence/sql-only

          python3 - "$RELEASE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          expected_revision = sys.argv[1]
          reports = {
              Path("ci-evidence/comparison/comparison.json"):
                  ("images", "benchmark_client", "source_revision"),
              Path("ci-evidence/comparison/whole-row.json"):
                  ("environment", "source_revision"),
              Path("ci-evidence/sql-only/sql-only.json"):
                  ("environment", "source_revision"),
          }
          for path, revision_path in reports.items():
              report = json.loads(path.read_text(encoding="utf-8"))
              value = report
              for key in revision_path:
                  value = value[key]
              if value != expected_revision:
                  raise SystemExit(
                      f"{path}: source revision {value!r} != {expected_revision!r}"
                  )
              if report.get("gate", {}).get("status") != "PASS":
                  raise SystemExit(f"{path}: benchmark gate is not PASS")
              markdown = path.with_suffix(".md")
              if not markdown.is_file() or markdown.stat().st_size == 0:
                  raise SystemExit(f"{markdown}: missing benchmark Markdown")
          PY

          evidence_name="pg_local_cache-${VERSION}-${SHORT_SHA}-ci-benchmarks"
          epoch="$(git show -s --format=%ct "$RELEASE_SHA")"
          find ci-evidence -exec touch -h -d "@${epoch}" {} +
          tar \
            --sort=name \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime="@${epoch}" \
            -C ci-evidence \
            -cf - \
            . |
            gzip -n -9 > "dist/${evidence_name}.tar.gz"

      - name: Create and verify checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf '%f\0' |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload per-commit downloadable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pg_local_cache-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.metadata.outputs.version }}
      STABLE_TAG: ${{ needs.metadata.outputs.stable_tag }}
      COMMIT_TAG: ${{ needs.metadata.outputs.commit_tag }}
      RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      STABLE_PUBLISHABLE: ${{ needs.metadata.outputs.stable_publishable }}
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: pg_local_cache-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.short_sha }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish immutable commit prerelease and optional stable release
        shell: bash
        run: |
          set -Eeuo pipefail

          create_ref() {
            local tag="$1"
            local existing
            existing="$(
              gh api "repos/${GH_REPO}/commits/${tag}" \
                --jq .sha 2>/dev/null || true
            )"
            if [[ -n "$existing" ]]; then
              [[ "$existing" == "$RELEASE_SHA" ]] || {
                echo "::error::Refusing to move immutable tag ${tag}"
                return 1
              }
              return
            fi
            gh api \
              --method POST \
              "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${RELEASE_SHA}" >/dev/null
          }

          upload_missing_assets() {
            local tag="$1"
            local existing_assets temporary
            existing_assets="$(
              gh release view "$tag" --json assets --jq '.assets[].name'
            )"
            temporary="$(mktemp -d)"
            for file in dist/*; do
              local name
              name="$(basename "$file")"
              if grep -Fxq "$name" <<<"$existing_assets"; then
                mkdir -p "$temporary/$name"
                gh release download "$tag" \
                  --pattern "$name" \
                  --dir "$temporary/$name"
                cmp --silent "$file" "$temporary/$name/$name" || {
                  echo "::error::Existing ${tag}/${name} differs; refusing overwrite"
                  return 1
                }
              else
                gh release upload "$tag" "$file"
              fi
            done
          }

          create_ref "$COMMIT_TAG"
          if ! gh release view "$COMMIT_TAG" >/dev/null 2>&1; then
            gh release create "$COMMIT_TAG" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "pg_local_cache ${VERSION} — main ${RELEASE_SHA:0:12}" \
              --notes "Successful main build ${RELEASE_SHA}. Includes PostgreSQL 16 source/binary packages, checksums, installer and CI benchmark evidence."
          fi
          upload_missing_assets "$COMMIT_TAG"
          gh release edit "$COMMIT_TAG" --draft=false --prerelease

          if [[ "$STABLE_PUBLISHABLE" == "true" ]]; then
            create_ref "$STABLE_TAG"
            if ! gh release view "$STABLE_TAG" >/dev/null 2>&1; then
              gh release create "$STABLE_TAG" \
                --verify-tag \
                --draft \
                --title "pg_local_cache ${VERSION} — PostgreSQL 16" \
                --notes "Immutable pg_local_cache ${VERSION} release for PostgreSQL 16. Read docs/INSTALL_EXISTING.md before installing on an existing cluster."
            fi
            upload_missing_assets "$STABLE_TAG"
            gh release edit "$STABLE_TAG" --draft=false --prerelease=false
          fi

name: Apply SELECT IN docs and benchmarks cleanly

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: apply-select-in-clean
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'aicopilot-fr/pg_local_cache' &&
      github.head_ref == 'feat/ordinary-select-in'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/ordinary-select-in
          fetch-depth: 0

      - name: Apply, validate, and publish non-workflow files
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -Fq 'PGLC_BENCH_ROW_SQL_IN_KEYS' benchmarks/whole_row.py && \
             grep -Fq 'single-column `IN`/`ANY`' README.md; then
            echo 'SELECT IN documentation and benchmarks are already applied'
            exit 0
          fi

          source_commit='adf0b9cf1c5bce1c19d8811d9620bc34fbe00e5c'
          mkdir -p /tmp/select-in-patches

          for suffix in 00 01 02 03 04; do
            git show "${source_commit}:.agent/benchmark.b64.${suffix}"
          done | tr -d '\r\n' | base64 -d \
            > /tmp/select-in-patches/benchmark.patch

          git show "${source_commit}:.agent/select-in-docs.patch" \
            > /tmp/select-in-patches/docs.patch

          sed -i 's/^ diff --git /diff --git /' \
            /tmp/select-in-patches/benchmark.patch
          sed -i \
            's/^-the row shape and zero-or-one-row semantics remain ordinary PostgreSQL;$/-the row shape and zero-or-one-row semantics remain ordinary PostgreSQL:/' \
            /tmp/select-in-patches/docs.patch

          git apply --check /tmp/select-in-patches/docs.patch
          git apply /tmp/select-in-patches/docs.patch
          git apply --check /tmp/select-in-patches/benchmark.patch
          git apply /tmp/select-in-patches/benchmark.patch

          python3 -m py_compile \
            benchmarks/scenarios.py \
            benchmarks/whole_row.py \
            scripts/validate_benchmark_evidence.py \
            tests/release_evidence_test.py \
            tests/whole_row_benchmark_test.py \
            tests/pages_contract_test.py
          make source-test source-sanitize benchmark-test
          python3 -m unittest -v \
            tests/release_evidence_test.py \
            tests/pages_contract_test.py
          git diff --check

          # The Actions token may not update workflow files. The validated CI
          # change is committed separately through the GitHub connector.
          git checkout -- .github/workflows/ci.yml

          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          test ! -e .agent
          git diff --cached --check
          git commit -m 'docs: document and benchmark ordinary SELECT IN'
          git push origin HEAD:feat/ordinary-select-in

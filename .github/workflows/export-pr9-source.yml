name: Export PR9 source

on:
  push:
    branches:
      - agent/export-pr9-source
    paths:
      - .github/workflows/export-pr9-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/export-pr9-source
          fetch-depth: 1
      - name: Pack source
        run: tar --exclude=.git -czf /tmp/pr9-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr9-source
          path: /tmp/pr9-source.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Apply SELECT IN documentation and benchmarks

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: apply-select-in-documentation-benchmarks
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/apply-select-in-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/ordinary-select-in
          fetch-depth: 0

      - name: Decode, apply, and validate the patches
        shell: bash
        run: |
          set -Eeuo pipefail

          cat .agent/benchmark.b64.* | tr -d '\n' | base64 -d > /tmp/select-in-benchmark.patch
          echo 'fbaa92798768e834e81b5a3b9321e1ee29c1a41aae77ef16a8b385937ceadc0c  /tmp/select-in-benchmark.patch' | sha256sum -c -

          cat .agent/docs.b64.* | tr -d '\n' | base64 -d > /tmp/select-in-docs.patch
          echo '68a289dba8943adaf60792de9f8c9a7de1df2fe2799aea896f04a53d94a3110b  /tmp/select-in-docs.patch' | sha256sum -c -

          git apply --check /tmp/select-in-benchmark.patch
          git apply /tmp/select-in-benchmark.patch
          git apply --check /tmp/select-in-docs.patch
          git apply /tmp/select-in-docs.patch

          rm -rf .agent
          rm -f .github/workflows/apply-select-in-benchmark.yml

          python3 -m py_compile \
            benchmarks/scenarios.py \
            benchmarks/whole_row.py \
            scripts/validate_benchmark_evidence.py \
            tests/release_evidence_test.py \
            tests/whole_row_benchmark_test.py \
            tests/pages_contract_test.py
          make source-test source-sanitize benchmark-test
          python3 -m unittest -v \
            tests/release_evidence_test.py \
            tests/pages_contract_test.py
          git diff --check

      - name: Publish one clean commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git reset --soft 222924cf097534394582539096611dcc764e1029
          git diff --cached --check
          test ! -e .agent
          test ! -e .github/workflows/apply-select-in-benchmark.yml
          git commit -m 'docs: document and benchmark ordinary SELECT IN'
          git push --force-with-lease origin HEAD:feat/ordinary-select-in

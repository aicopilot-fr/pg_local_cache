name: Export agent source snapshot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Archive exact source
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output=pg_local_cache-source.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-source-snapshot
          path: pg_local_cache-source.tar.gz
          if-no-files-found: error
          retention-days: 1
